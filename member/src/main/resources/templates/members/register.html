<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0f0f13;
            --card: #18181f;
            --border: #2a2a35;
            --accent: #6c63ff;
            --accent-glow: rgba(108,99,255,0.35);
            --text: #e8e8f0;
            --muted: #7a7a9a;
            --input-bg: #111118;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body::before {
            content: '';
            position: fixed;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(108,99,255,0.12) 0%, transparent 70%);
            top: -100px; right: -100px;
            pointer-events: none;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 48px 44px;
            width: 100%;
            max-width: 420px;
            animation: fadeUp 0.5s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .logo {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 32px;
        }

        h1 { font-size: 26px; font-weight: 700; margin-bottom: 6px; }

        .subtitle { font-size: 13px; color: var(--muted); margin-bottom: 36px; }

        .field { margin-bottom: 18px; }

        label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--muted);
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 13px 16px;
            font-size: 14px;
            font-family: inherit;
            color: var(--text);
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        input::placeholder { color: #3a3a55; }

        .btn {
            width: 100%;
            margin-top: 8px;
            padding: 14px;
            background: var(--accent);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            font-family: inherit;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
        }

        .btn:hover {
            background: #7d75ff;
            box-shadow: 0 6px 24px var(--accent-glow);
        }

        .btn:active { transform: scale(0.98); }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 0;
            color: var(--muted);
            font-size: 12px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .footer { text-align: center; font-size: 13px; color: var(--muted); }

        .footer a { color: var(--accent); text-decoration: none; font-weight: 500; }

        .footer a:hover { text-decoration: underline; }

        .error {
            background: rgba(255, 80, 80, 0.1);
            border: 1px solid rgba(255, 80, 80, 0.3);
            color: #ff6b6b;
            font-size: 13px;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">Member</div>
    <h1>시작해볼까요 🚀</h1>
    <p class="subtitle">새 계정을 만드세요</p>

    <div class="error" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/members/new}" method="post">
        <div class="field">
            <label for="name">이름</label>
            <input type="text" id="name" name="name" placeholder="홍길동" required />
        </div>
        <div class="field">
            <label for="email">이메일</label>
            <input type="email" id="email" name="email" placeholder="example@email.com" required />
        </div>
        <div class="field">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn">회원가입</button>
    </form>

    <div class="divider">또는</div>

    <div class="footer">
        이미 계정이 있으신가요? <a th:href="@{/login}">로그인</a>
    </div>
</div>
</body>
</html>
